<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Stock- Justina store</title>

    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/styleadmin.css">
    <link rel="icon" type="image/png" href="imagenes/favicon.png">
</head>

<body>

    <div id="header-container"></div>


    <main class="admin-container">

        <!-- BARRA SUPERIOR: Título a la izquierda, Botón compacto a la derecha -->
        <div class="admin-top-bar">
            <div>
                <h1>Control de Stock</h1>
                <p class="subtitulo-admin">Gestioná el inventario, talles y precios de tu tienda.</p>
            </div>
            <button id="btn-abrir-form" class="btn-nueva-prenda">
                ➕ Cargar Nueva Prenda
            </button>
        </div>
        <!-- TABLA DE INVENTARIO -->
        <div class="seccion-tabla">
            <div class="tabla-header-bar">
                <h3>Inventario Cargado</h3>
                <!-- Buscador por nombre -->
                <input type="text" id="buscar-inventario" class="input-buscar-admin"
                    placeholder="🔍 Buscar por prenda...">
            </div>

            <div class="contenedor-tabla-card">
                <table class="tabla-admin">
                    <thead>
                        <tr>
                            <th style="width: 70px;">Foto</th>
                            <th>Prenda y Categoría</th>
                            <th>Precio</th>
                            <th>Variantes y Stock</th>
                            <th style="text-align: right;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-inventario">
                        <!-- Se genera con JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- BACKDROP Y VENTANA MODAL PARA CARGAR PRENDA -->
        <div id="modal-backdrop-crear" class="modal-backdrop oculto">
            <div class="modal-card">
                <div class="panel-header">
                    <h3>Cargar Nueva Prenda</h3>
                    <button type="button" id="btn-cerrar-form" class="btn-cerrar-panel" title="Cerrar modal">✕</button>
                </div>

                <form id="form-admin" class="form-editorial-admin">
                    <div class="campo-full">
                        <label>Nombre de la prenda *</label>
                        <input type="text" id="prod-nombre" required placeholder="Ej. Calza Oxford">
                    </div>

                    <div class="grilla-2-col">
                        <div>
                            <label>Precio ($) *</label>
                            <input type="number" id="prod-precio" required placeholder="22000">
                        </div>
                        <div>
                            <label>Categoría</label>
                            <div style="display: flex; gap: 0.5rem;">
                                <select id="prod-categoria" style="flex: 1;" required></select>
                                <button type="button" id="btn-nueva-categoria" class="btn-secundario">+
                                    Categoría</button>
                            </div>
                        </div>
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <label style="display:block; font-weight:bold; color:#3b2314; margin-bottom:0.3rem;">Descripción
                            y Cuidados:</label>
                        <textarea id="admin-descripcion" rows="3"
                            style="width:100%; padding:0.5rem; border: 1px solid #ccc; border-radius:4px;"></textarea>
                    </div>

                    <div class="caja-variantes">
                        <label style="margin-bottom: 0.8rem; display: block; font-weight: 600;">
                            Combinaciones de Talle, Color y Stock *
                        </label>
                        <div id="contenedor-variantes">
                            <div class="fila-variante">
                                <input type="text" placeholder="Talle (S, M...)" class="var-talle" required
                                    style="width: 30%;">
                                <input type="text" placeholder="Color (Negro...)" class="var-color" required
                                    style="width: 45%;">
                                <input type="number" placeholder="Stock" class="var-stock" required min="0"
                                    style="width: 25%;">
                            </div>
                        </div>
                        <button type="button" id="btn-agregar-variante" class="btn-secundario"
                            style="margin-top: 0.8rem;">
                            + Agregar otra combinación
                        </button>
                    </div>

                    <div class="campo-full">
                        <label>Fotos de la prenda (Podés seleccionar hasta 5 fotos) *</label>
                        <input type="file" id="prod-imagenes" accept="image/*" multiple required>
                    </div>

                    <button type="submit" class="btn-guardar-admin">
                        💾 Guardar Prenda y Stock
                    </button>
                </form>
            </div>
        </div>

        <!-- MODAL DE EDICIÓN / RE-STOCK -->
        <div id="modal-backdrop-editar" class="modal-backdrop oculto">
            <div class="modal-card">
                <div class="panel-header">
                    <h3>Editar Prenda / Re-stock</h3>
                    <button type="button" id="btn-cerrar-editar" class="btn-cerrar-panel"
                        title="Cerrar modal">✕</button>
                </div>

                <form id="form-editar" class="form-editorial-admin">
                    <input type="hidden" id="edit-prod-id">

                    <div class="campo-full">
                        <label>Nombre de la prenda</label>
                        <input type="text" id="edit-prod-nombre" required>
                    </div>

                    <div class="grilla-2-col">
                        <div>
                            <label>Precio ($)</label>
                            <input type="number" id="edit-prod-precio" required>
                        </div>
                        <div>
                            <label>Categoría</label>
                            <select id="edit-prod-categoria" required></select>
                        </div>

                        <div style="margin-bottom: 1rem;">
                            <label
                                style="display:block; font-weight:bold; color:#3b2314; margin-bottom:0.3rem;">Descripción
                                y Cuidados:</label>
                            <textarea id="edit-descripcion" rows="3"
                                style="width:100%; padding:0.5rem; border: 1px solid #ccc; border-radius:4px;"></textarea>
                        </div>

                        <!-- GESTOR DE IMÁGENES ACTUALES Y NUEVAS -->
                        <div class="caja-variantes" style="margin-top: 1rem;">
                            <label style="margin-bottom: 0.8rem; display: block; font-weight: 600;">
                                Imágenes y Orden en la Tienda
                            </label>

                            <div id="contenedor-edit-fotos" class="grilla-fotos-edit"></div>

                            <!-- Input para sumar fotos nuevas -->
                            <div style="margin-top: 1rem;">
                                <label style="font-size: 0.8rem; color: #694a32;">¿Querés agregar o reemplazar
                                    fotos?</label>
                                <input type="file" id="edit-prod-imagenes" accept="image/*" multiple>
                            </div>
                        </div>
                    </div>

                    <!-- Lista autogenerada para cambiar cantidades de stock -->
                    <div class="caja-variantes">
                        <label style="margin-bottom: 0.8rem; display: block; font-weight: 600;">
                            Ajustar Stock por Talle y Color (Re-stock)
                        </label>
                        <div id="contenedor-edit-variantes">
                            <!-- Se llena con JS -->
                        </div>
                    </div>

                    <button type="submit" class="btn-guardar-admin">
                        💾 Guardar Cambios de Stock
                    </button>
                </form>
            </div>
        </div>

    </main>


    <div id="contenedor-footer"></div>

<script src="config.js"></script>
    <script src="admin.js"></script>
    <script src="script.js"></script>
    
</body>

</html>
