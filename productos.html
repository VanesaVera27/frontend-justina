<!DOCTYPE html>
<html lang="es">

<head>
    <title>Justina Store</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/styleoferta.css">
    <link rel="icon" type="image/png" href="imagenes/favicon.png">
</head>

<body>

    <div id="header-container"></div>

    <!-- Contenedor dinámico para el banner de la página -->
    <div id="banner-dinamico-pagina" class="hero-slider-container"
        style="position: relative; width: 100%; height: 300px; background-size: cover; background-position: center; margin-bottom: 2rem;">
    </div>

    <!-- Catálogo de Productos -->
    <main class="contenedor">
        <h2 id="titulo-contenedor"> ✦ Productos ✦</h2>
        <div class="grilla-productos" id="grilla-productos">
            <!-- Los productos se generarán acá desde script.js -->
        </div>
    </main>


    <div id="contenedor-modales"></div>

    <div id="contenedor-footer"></div>

    <script src="config.js"></script>
    <script src="script.js"></script>
    <script src="productos.js"></script>
</body>

</html>
