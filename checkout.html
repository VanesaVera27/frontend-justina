<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - Justina Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Playfair+Display:ital,wght@1,400;1,500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo">
            <a href="index.html" class="logo-principal">justina store</a>
        </div>
    </header>

    <main style="max-width: 900px; margin: 2rem auto; padding: 0 1rem;">
        <h1 style="font-size: 1.8rem; margin-bottom: 1.5rem; font-family: 'Playfair Display', serif;">DATOS DE ENVÍO Y
            FACTURACIÓN</h1>

        <form id="form-checkout"
            style="background: #f9f9f9; padding: 2rem; border: 1px solid #e0e0e0; border-radius: 4px; display: grid; gap: 1rem;">

            <h3
                style="font-size: 1.1rem; border-bottom: 1px solid #ccc; padding-bottom: 0.5rem; margin-bottom: 0.5rem;">
                1. Datos de Contacto y Facturación</h3>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 0.3rem;">Nombre y Apellido</label>
                    <input type="text" id="checkout-nombre" required readonly
                        style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; background: #eee; cursor: not-allowed;">
                </div>
                <div>
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 0.3rem;">Email</label>
                    <input type="email" id="checkout-email" required readonly
                        style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; background: #eee; cursor: not-allowed;">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 0.3rem;">DNI</label>
                    <input type="text" id="checkout-dni" required readonly
                        style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; background: #eee; cursor: not-allowed;">
                </div>
                <div>
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 0.3rem;">Teléfono / Celular</label>
                    <input type="text" id="checkout-telefono" required placeholder="Ej: 1112345678"
                        style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>
            </div>

            <h3
                style="font-size: 1.1rem; border-bottom: 1px solid #ccc; padding-bottom: 0.5rem; margin: 1rem 0 0.5rem 0;">
                2. Datos de Envío</h3>

            <!-- Opción para elegir direcciones guardadas -->
            <div id="seccion-direcciones-guardadas">
                <label style="display: block; font-size: 0.85rem; margin-bottom: 0.3rem;">Seleccioná una dirección
                    guardada</label>
                <select id="select-direccion-guardada"
                    style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 0.5rem;">
                    <!-- Se llena con JS -->
                </select>
                <button type="button" id="btn-mostrar-nueva-dir"
                    style="background: none; border: none; color: #3b2314; text-decoration: underline; cursor: pointer; font-size: 0.85rem; padding: 0;">+
                    Agregar una nueva dirección</button>
            </div>

            <!-- Formulario para nueva dirección (oculto por defecto si ya tiene guardadas) -->
            <div id="seccion-nueva-direccion"
                style="display: none; background: #fff; padding: 1rem; border: 1px dashed #ccc; border-radius: 4px; margin-top: 0.5rem;">
                <p style="font-weight: bold; font-size: 0.9rem; margin-bottom: 0.8rem;">Nueva Dirección de Envío</p>
                <div style="display: grid; gap: 0.8rem;">
                    <div>
                        <label style="display: block; font-size: 0.8rem; margin-bottom: 0.2rem;">Calle y Número
                            *</label>
                        <input type="text" id="nueva-calle" placeholder="Ej: Av. Santa Fe 1234, Piso 2A"
                            style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem;">
                        <div>
                            <label style="display: block; font-size: 0.8rem; margin-bottom: 0.2rem;">Código Postal
                                *</label>
                            <input type="text" id="nuevo-cp" placeholder="Ej: 1615"
                                style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                        </div>
                        <div>
                            <label style="display: block; font-size: 0.8rem; margin-bottom: 0.2rem;">Localidad *</label>
                            <input type="text" id="nueva-localidad" placeholder="Ej: Grand Bourg"
                                style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem;">
                        <div>
                            <label style="display: block; font-size: 0.8rem; margin-bottom: 0.2rem;">Provincia *</label>
                            <input type="text" id="nueva-provincia" placeholder="Ej: Buenos Aires"
                                style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                        </div>
                        <div>
                            <label style="display: block; font-size: 0.8rem; margin-bottom: 0.2rem;">País *</label>
                            <input type="text" id="nuevo-pais" value="Argentina"
                                style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                        </div>
                    </div>
                    <button type="button" id="btn-cancelar-nueva-dir"
                        style="background: none; border: none; color: #666; text-decoration: underline; cursor: pointer; font-size: 0.8rem; width: fit-content; padding: 0;">&larr;
                        Volver a mis direcciones guardadas</button>
                </div>
            </div>

            <div style="margin-top: 1rem;">
                <label style="display: block; font-size: 0.85rem; margin-bottom: 0.3rem;">Persona que recibe
                    (Opcional)</label>
                <input type="text" id="checkout-recibe" placeholder="Dejar en blanco si recibís vos"
                    style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div style="margin-top: 1.5rem; text-align: right;">
                <button type="submit"
                    style="background: #000; color: #fff; border: none; padding: 0.9rem 2rem; font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px;">
                    Continuar al Pago &rarr;
                </button>
            </div>
        </form>
    </main>


    <div id="contenedor-footer"></div>

    <script src="checkout.js"></script>
    <script src="script.js"></script>
</body>

</html>
