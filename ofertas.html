<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas - Justina Store</title>

    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/styleoferta.css">
    <link rel="icon" type="image/png" href="imagenes/favicon.png">
</head>

<body>

   <div id="header-container"></div>

    <!-- Banner Principal -->
    <section class="banner">

        <div class="banner-logo">
            <h1>justina</h1>
            <h2>store</h2>
        </div>

        <p>More than basics</p>
    </section>

    <!-- Contenedor Principal de Ofertas -->
    <main class="contenedor" style="padding-top: 3rem; min-height: 60vh;">
        <h2 id="titulo-contenedor" style="margin-bottom: 2rem; color: #c53030;">✦ Special Sale ✦</h2>

        <!-- Le cambiamos el ID para controlarlo desde un script distinto -->
        <div class="grilla-productos" id="grilla-ofertas">
            <p style="grid-column: 1/-1; text-align: center; color: #666;">Buscando los mejores precios...</p>
        </div>
    </main>


    <div id="contenedor-modales"></div>

    <div id="contenedor-footer"></div>

    <script src="script.js"></script>
    <script src="ofertas.js"></script>
</body>

</html>
