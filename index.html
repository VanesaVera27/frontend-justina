<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justina Store</title>

    <!-- TRAEMOS ABRIL FATFACE + PLAYFAIR DISPLAY CURSIVA (ITALIC) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Playfair+Display:ital,wght@1,400;1,500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header y Navegación -->
    <header class="header">

        <div class="logo">
            <span class="logo-principal">justina</span>
        </div>

        <nav>
            <a href="#" id="nav-inicio">Inicio</a>

            <!-- MENÚ DESPLEGABLE DE COLECCIÓN -->
            <div class="dropdown-coleccion">
                <a href="#" id="nav-coleccion" class="dropdown-btn">Colección ▾</a>
                <div class="dropdown-contenido" id="menu-categorias">
                    <a href="#" onclick="filtrarPorCategoria('Todos')">Ver Todo</a>
                    <!-- Las categorías se cargarán acá dinámicamente con JS -->
                </div>
            </div>

            <a href="#" id="nav-ofertas">Ofertas</a>
        </nav>
        <!-- ZONA DE ACCIONES DEL HEADER -->
        <div class="acciones-header">
            <a href="admin.html" id="btn-config-admin" class="btn-user"
                style="display: none; background: #e67e22; border-color: #e67e22; text-decoration: none;">
                ⚙️ Control de Stock
            </a>
            <a href="pedidos-admin.html" id="btn-pedidos-admin" class="btn-user"
                style="display: none; background: #e67e22; border-color: #e67e22; text-decoration: none;">
                ⚙️ Control de Pedidos
            </a>

            <a href="perfil.html" id="btn-perfil" class="btn-user"
                style="display: none; background: #e67e22; border-color: #e67e22; text-decoration: none;">
                ⚙️ Mi perfil
            </a>

            <!-- 2. Botón de Iniciar Sesión / Nombre de Usuario -->
            <button id="btn-login-header" class="btn-user">👤 Iniciar Sesión</button>

            <!-- 3. Botón del Carrito -->
            <div class="carrito" id="boton-carrito">
                🛒 <span id="contador-carrito">0</span>
            </div>
        </div>
    </header>

    <!-- Banner Principal -->
    <section class="banner">

        <div class="banner-logo">
            <h1>justina</h1>
            <h2>store</h2>
        </div>

        <p>More than basics</p>
    </section>

    <!-- Catálogo de Productos -->
    <main class="contenedor">
        <h2>Nuestros Productos</h2>
        <div class="grilla-productos" id="grilla-productos">
            <!-- Los productos se generarán acá desde script.js -->
        </div>
    </main>


    <!-- NUEVO: Ventana Modal del Carrito -->
    <div class="modal-overlay" id="modal-carrito">
        <div class="modal-contenido">
            <div class="modal-header">
                <h2>Tu Carrito</h2>
                <button class="btn-cerrar" id="btn-cerrar-modal">&times;</button>
            </div>

            <!-- Acá se insertan los productos que agreguemos con JS -->
            <div class="modal-cuerpo" id="lista-carrito">
                <p class="carrito-vacio">El carrito está vacío.</p>
            </div>

            <!-- Pie del carrito con el total -->
            <div class="modal-footer" style="flex-direction: column; gap: 0.8rem;">
                <div style="width: 100%; text-align: left;">
                    <label style="font-size: 0.85rem; font-weight: bold; color: #333; display: block;">
                        📍 Elegí la dirección de envío:
                    </label>
                    <select id="select-direccion-envio"
                        style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; margin-top: 4px;">
                        <option value="">Cargando direcciones...</option>
                    </select>
                    <small style="display:block; margin-top:0.3rem;">
                        ¿Otra dirección? <a href="perfil.html" style="color:#3b2314; font-weight:bold;">Agregala en Mi
                            Perfil</a>
                    </small>
                </div>

                <div class="total-contenedor" style="width: 100%; display: flex; justify-content: space-between;">
                    <span>Total:</span>
                    <span id="total-precio">$0</span>
                </div>
                <button class="btn-comprar" id="btn-finalizar-compra" style="width: 100%;">Finalizar compra</button>
            </div>
        </div>
    </div>

    <!-- VENTANA MODAL DOBLE: INICIO DE SESIÓN / REGISTRO -->
    <div class="modal-overlay" id="modal-login">
        <div class="modal-contenido modal-login-box">
            <div class="modal-header">
                <!-- Pestañas para alternar qué formulario ver -->
                <div class="pestanas-login" style="display: flex; gap: 1rem; font-size: 1.2rem; font-weight: bold;">
                    <span id="tab-login"
                        style="cursor: pointer; color: #1a1a1a; border-bottom: 2px solid #1a1a1a;">Ingresar</span>
                    <span id="tab-registro" style="cursor: pointer; color: #888;">Crear Cuenta</span>
                </div>
                <button class="btn-cerrar" id="btn-cerrar-modal-login">&times;</button>
            </div>

            <!-- 1. FORMULARIO DE INICIO DE SESIÓN -->
            <form id="form-login" class="modal-cuerpo form-login">
                <label>Correo Electrónico</label>
                <input type="email" id="email-user" required placeholder="tuemail@ejemplo.com">

                <label>Contraseña</label>
                <input type="password" id="password-user" required placeholder="••••••••">

                <button type="submit" class="btn-comprar" style="margin-top: 1rem; ">
                    Iniciar Sesión
                </button>
            </form>

            <!-- 2. FORMULARIO DE REGISTRO DE CLIENTE NUEVO (Oculto por defecto) -->
            <form id="form-registro" class="modal-cuerpo form-login" style="display: none;">
                <label>Nombre y Apellido *</label>
                <input type="text" id="reg-nombre" required placeholder="Ej. Camila Pérez">

                <label>Correo Electrónico *</label>
                <input type="email" id="reg-email" required placeholder="camila@ejemplo.com">

                <label>Contraseña *</label>
                <input type="password" id="reg-pass" required placeholder="Mínimo 6 caracteres" minlength="6">

                <button type="submit" class="btn-comprar" style="margin-top: 1rem; ">
                    Registrarme y Entrar
                </button>

            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
