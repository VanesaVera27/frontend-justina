<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Favoritos - Justina Store</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="icon" type="image/png" href="imagenes/favicon.png">
</head>

<body>

    <div id="header-container"></div>

    <!-- Contenedor Principal de Favoritos -->
    <main class="contenedor" style="padding-top: 3rem; min-height: 60vh;">
        <h2 id="titulo-contenedor" style="margin-bottom: 2rem;">Mis Favoritos ❤️</h2>
        <div class="grilla-productos" id="grilla-favoritos">
            <!-- Los favoritos se generan acá por JS -->
            <p style="grid-column: 1/-1; text-align: center; color: #666;">Cargando tus prendas favoritas...</p>
        </div>
    </main>

    <div id="contenedor-modales"></div>

    <div id="contenedor-footer"></div>

    <script src="script.js"></script>
    <script src="favoritos.js"></script>
</body>

</html>
