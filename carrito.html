<!DOCTYPE html>
<html lang="es">

<head>
    <title>Tu Carrito - Justina Store</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/stylecarrito.css">
    <link rel="icon" type="image/png" href="imagenes/favicon.png">
</head>

<body>

    <body>

        <div id="header-container"></div>

        <main class="contenedor-carrito-pagina" style="max-width: 1200px; margin: 2rem auto; padding: 0 1rem;">
            <h1 id="titulo-carrito-pagina">TU CARRITO (0 productos)</h1>

            <div class="carrito-layout-principal"
                style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; align-items: start;">

                <!-- Columna Izquierda: Listado de Artículos -->
                <div class="carrito-items-container">
                    <div id="lista-carrito-pagina">
                        <!-- El JS inyectará los productos acá -->
                    </div>
                </div>

                <!-- Columna Derecha: Resumen de Compra -->
                <div class="carrito-resumen-card"
                    style="background: #f9f9f9; padding: 1.5rem; border: 1px solid #e0e0e0; border-radius: 4px;">
                    <h3
                        style="font-size: 1.2rem; margin-bottom: 1rem; border-bottom: 1px solid #ccc; padding-bottom: 0.5rem;">
                        RESUMEN DE COMPRA</h3>

                    <div
                        style="display: flex; justify-content: space-between; margin-bottom: 0.8rem; font-size: 0.95rem;">
                        <span>Subtotal</span>
                        <span id="resumen-subtotal">$0</span>
                    </div>
                    <div
                        style="display: flex; justify-content: space-between; margin-bottom: 1rem; font-size: 0.95rem; color: #666;">
                        <span>Impuestos nacionales</span>
                        <span id="resumen-impuestos">$0</span>
                    </div>
                    <div
                        style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; font-size: 1.2rem; font-weight: bold; border-top: 1px solid #ccc; padding-top: 0.8rem;">
                        <span>TOTAL</span>
                        <span id="resumen-total">$0</span>
                    </div>

                    <button id="btn-iniciar-compra"
                        style="width: 100%; background: #000; color: #fff; border: none; padding: 0.9rem; font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px;">
                        Iniciar Compra
                    </button>

                    <div style="margin-top: 1rem; text-align: center;">
                        <a href="index.html" style="color: #333; font-size: 0.85rem; text-decoration: underline;">Seguir
                            comprando</a>
                    </div>
                </div>

            </div>
        </main>

        <div id="contenedor-modales"></div>

        <div id="contenedor-footer"></div>

<script src="config.js"></script>
        <script src="script.js"></script>
        <script src="carrito.js"></script>
        
    </body>

</html>
