<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Justina store</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/stylecontacto.css">
    <link rel="icon" type="image/png" href="imagenes/favicon.png">
</head>

<body>

    <div id="header-container"></div>

    <div class="banner-contacto">
        <h1>Contacto</h1>
        <div class="info-contacto-directo">

            <!-- WhatsApp -->
            <a href="#" target="_blank" class="link-contacto" id="contacto-wsp-link">
                <svg viewBox="0 0 24 24" class="icono-mini" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
                </svg>
                <span id="contacto-wsp-text">+54 9 11 2525-0523</span>
            </a>

            <!-- Teléfono -->
            <a href="#" class="link-contacto" id="contacto-tel-link">
                <svg viewBox="0 0 24 24" class="icono-mini" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
                </svg>
                <span id="contacto-tel-text">11 2525-0523</span>
            </a>

            <!-- Email -->
            <a href="#" class="link-contacto" id="contacto-email-link">
                <svg viewBox="0 0 24 24" class="icono-mini" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                    <polyline points="22,6 12,13 2,6" />
                </svg>
                <span id="contacto-email-text">justinastore2036@gmail.com</span>
            </a>

            <!-- Ubicación -->
            <a href="#" target="_blank" class="link-contacto" id="contacto-mapa-link">
                <svg viewBox="0 0 24 24" class="icono-mini" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                    <circle cx="12" cy="10" r="3" />
                </svg>
                <span id="contacto-ubicacion-text">Los Polvorines, Malvinas Argentinas</span>
            </a>
        </div>
    </div>

    <main class="contenedor-contacto">
        <form id="form-contacto" class="formulario-editorial">
            <div class="campo-form">
                <label for="cont-nombre">Nombre</label>
                <input type="text" id="cont-nombre" placeholder="ej.: María Pérez" required>
            </div>

            <div class="campo-form">
                <label for="cont-email">Email</label>
                <input type="email" id="cont-email" placeholder="ej.: tuemail@email.com" required>
            </div>

            <div class="campo-form">
                <label for="cont-telefono">Teléfono</label>
                <input type="tel" id="cont-telefono" placeholder="ej.: 1123445567">
            </div>

            <div class="campo-form">
                <label for="cont-mensaje">Mensaje</label>
                <textarea id="cont-mensaje" rows="5" placeholder="ej.: Tu mensaje" required></textarea>
            </div>

            <button type="submit" class="btn-comprar btn-enviar-contacto">Enviar</button>
        </form>
    </main>

    <div id="contenedor-modales"></div>

    <div id="contenedor-footer"></div>

    <script src="script.js"></script>
</body>

</html>
