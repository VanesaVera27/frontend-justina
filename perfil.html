<!DOCTYPE html>
<html lang="es">

<head>
    <title>Mi Perfil - Justina Store</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/styleperfil.css">
    <link rel="icon" type="image/png" href="imagenes/favicon.png">
</head>

<body>

    <div id="header-container"></div>

    <main class="perfil-container">
        <h1>Mi Cuenta</h1>

        <!-- PESTAÑAS DEL PERFIL -->
        <div class="pestanas-perfil">
            <button class="tab-btn activo" onclick="cambiarTab('datos')">👤 Mis Datos</button>
            <button class="tab-btn" onclick="cambiarTab('direcciones')">📍 Mis Direcciones</button>
            <button class="tab-btn" onclick="cambiarTab('pedidos')">📦 Mis Pedidos</button>
        </div>

        <!-- SOLAPA 1: MIS DATOS -->
        <div id="tab-datos" class="vista-perfil activo">
            <form id="form-perfil" class="form-perfil-estilizado" style="max-width: 520px;">
                <label>Nombre y Apellido</label>
                <input type="text" id="perfil-nombre" required>

                <label>Correo Electrónico (No modificable)</label>
                <input type="email" id="perfil-email" disabled>

                <label>Nueva Contraseña</label>
                <input type="password" id="perfil-pass" placeholder="Dejar vacío si no querés cambiarla">

                <!-- NUEVOS CAMPOS LOGÍSTICOS -->
                <label style="margin-top: 1rem;">DNI</label>
                <input type="text" id="perfil-dni" placeholder="Ej: 40123456" required>

                <label style="margin-top: 1rem;">Teléfono / Celular</label>
                <input type="text" id="perfil-telefono" placeholder="Ej: 1123456789" required>
                <!-- FIN NUEVOS CAMPOS -->

                <button type="submit" class="btn-comprar" style="margin-top: 1.5rem;">💾 Guardar Cambios</button>
            </form>

            <div class="zona-riesgo" style="max-width: 520px;">
                <h3 style="color: #c53030; margin-top: 0; font-size: 1.1rem;">Zona de Riesgo</h3>
                <p style="font-size: 0.85rem; color: #666; margin-bottom: 1rem;">
                    Si eliminás tu cuenta, se borrará tu historial en la tienda permanentemente.
                </p>
                <button type="button" id="btn-eliminar-cuenta"
                    style="background: #e53e3e; color: white; border: none; padding: 0.6rem 1rem; border-radius: 4px; cursor: pointer; font-weight: 600;">
                    🗑️ Eliminar mi cuenta
                </button>
            </div>
        </div>

        <!-- SOLAPA 2: MIS DIRECCIONES -->
        <div id="tab-direcciones" class="vista-perfil">
            <h3 style="color: #3b2314; margin-top: 0;">Direcciones Guardadas</h3>
            <div id="lista-direcciones"></div>

            <hr style="margin: 2.5rem 0; border: 0; border-top: 1px solid #e8e1d5;">

            <h3 id="titulo-form-direccion" style="color: #3b2314; margin-bottom: 0.5rem;">➕ Agregar una nueva dirección
            </h3>
            <form id="form-nueva-direccion" class="form-perfil-estilizado grilla-direcciones">
                <!-- ID oculto para saber cuándo estamos editando -->
                <input type="hidden" id="dir-id-edicion" value="">

                <div class="grilla-full">
                    <label>Calle y Número *</label>
                    <input type="text" id="dir-calle" required placeholder="Ej: Av. Santa Fe 1234, Piso 2A">
                </div>
                <div>
                    <label>Código Postal *</label>
                    <input type="text" id="dir-cp" required placeholder="Ej: 1615">
                </div>
                <div>
                    <label>Localidad *</label>
                    <input type="text" id="dir-localidad" required placeholder="Ej: Grand Bourg">
                </div>
                <div>
                    <label>Provincia *</label>
                    <input type="text" id="dir-provincia" required placeholder="Ej: Buenos Aires">
                </div>
                <div>
                    <label>País *</label>
                    <input type="text" id="dir-pais" value="Argentina" required>
                </div>

                <div class="grilla-full" style="display: flex; gap: 1rem; align-items: center; margin-top: 1rem;">
                    <button type="submit" id="btn-submit-dir" class="btn-comprar"
                        style="width: auto; padding: 0.8rem 2rem;">
                        📍 Guardar Dirección
                    </button>
                    <button type="button" id="btn-cancelar-edicion" onclick="cancelarEdicionDir()"
                        style="display: none; background: #efe8de; border: none; padding: 0.8rem 1.5rem; border-radius: 6px; cursor: pointer; color: #3b2314; font-weight: bold;">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>

        <!-- SOLAPA 3: MIS PEDIDOS -->
        <div id="tab-pedidos" class="vista-perfil">
            <h3 style="color: #3b2314; margin-top: 0;">Historial de tus Compras</h3>
            <table class="tabla-mis-pedidos">
                <thead>
                    <tr>
                        <th># Pedido</th>
                        <th>Fecha</th>
                        <th>Prendas</th>
                        <th>Total</th>
                        <th>Estado Pedido</th>
                        <th>Estado Pago</th>
                        <th style="text-align: center;">Acción</th>
                    </tr>
                </thead>
                <tbody id="lista-mis-pedidos">
                    <tr>
                        <td colspan="6">Cargando...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div id="contenedor-modales"></div>

    <div id="contenedor-footer"></div>


    <script src="perfil.js"></script>
    <script src="script.js"></script>
</body>

</html>
